# Entorno para el visor WRF de la DANA Anibal.
#   conda env create -f environment.yml
#   conda activate wrfview
#
# wrf-python no tiene rueda de pip para Apple Silicon: conda-forge si trae
# compilacion osx-arm64, por eso este archivo usa conda y no requirements.txt.
name: wrfview
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy<2            # wrf-python 1.3.x no es compatible con numpy 2
  - netcdf4<1.7        # netCDF4 >=1.7 rompe wrf.getvar ("Dataset is not picklable")
  - wrf-python
  - cartopy
  - matplotlib
  - xarray
  - imageio           # animaciones GIF del generador por lotes
  - pyqt              # backend interactivo; en macOS sirve tambien el nativo
